    document.getElementById("main").addEventListener("input", e => {
      if (!state.admin) return;
      if (e.target.matches("[data-inline-p]")) {
        const page = currentPage();
        page[e.target.dataset.inlineP] = e.target.innerText;
        saveContent();
      } else if (e.target.matches("[data-inline-html]")) {
        const block = currentPage().blocks[Number(e.target.dataset.inlineHtml)];
        if (block) {
          block.html = e.target.innerHTML;
          saveContent();
        }
      } else if (e.target.matches("[data-inline-b]")) {
        const page = currentPage();
        const block = page.blocks[Number(e.target.dataset.inlineB)];
        if (block) {
          block[e.target.dataset.inlineF] = e.target.innerText;
          saveContent();
        }
      }
    });

    document.body.addEventListener("click", e => {
      const language = e.target.closest("[data-summary-lang]");
      if (language) {
        state.summaryLanguage = language.getAttribute("data-summary-lang") === "es" ? "es" : "en";
        localStorage.setItem("iom-summary-language", state.summaryLanguage);
        stopSpeak();
        renderPage(true);
        return;
      }
      const readButton = e.target.closest("[data-mark-read]");
      if (readButton) {
        state.read[readButton.getAttribute("data-mark-read")] = true;
        saveProgress();
        renderPage(true);
        renderNav();
        return;
      }
      const manualLink = e.target.closest('.manual-document a[href^="#"]');
      if (manualLink) {
        e.preventDefault();
        const anchor = manualLink.getAttribute("href").slice(1);
        const target = pages().find(page => page.anchor === anchor);
        if (target) {
          state.page = target.id;
          render();
          window.scrollTo(0, 0);
        }
        return;
      }
      if (e.target.closest("[data-save-changes]")) {
        commitContent();
        return;
      }
      const sl = e.target.closest("[data-slide]");
      if (sl && !sl.disabled) {
        goRel(Number(sl.getAttribute("data-slide")));
        return;
      }
      const go = e.target.closest("[data-go]");
      if (go) {
        state.page = go.getAttribute("data-go");
        stopSpeak();
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (e.target.closest("[data-toggle-editor]")) {
        if (state.editing && hasUnsavedChanges) {
          if (confirm("You have unsaved changes. Do you want to discard them?")) {
            localStorage.removeItem("iom-draft-content");
            localStorage.removeItem("iom-draft-settings");
            location.reload();
          }
          return;
        }
        state.editing = !state.editing;
        render();
        return;
      }
      if (e.target.closest("[data-stop-speak]")) { stopSpeak(); return; }
      const sp = e.target.closest("[data-speak]");
      if (sp) { speak(sp.getAttribute("data-speak"), sp.dataset.lang || state.summaryLanguage); return; }
      const play = e.target.closest("[data-play-steps]");
      if (play) {
        const el = document.getElementById("vidsteps-" + play.getAttribute("data-play-steps"));
        if (el) el.style.display = el.style.display === "none" ? "block" : "none";
        return;
      }
      const hs = e.target.closest("[data-hotspot]");
      if (hs) {
        state.ui.hotspot[hs.getAttribute("data-hotspot")] = Number(hs.dataset.i);
        renderPage();
        return;
      }
      const ck = e.target.closest("[data-check]");
      if (ck) {
        const key = ck.getAttribute("data-check");
        state.ui.checks[key] = state.ui.checks[key] || {};
        state.ui.checks[key][ck.dataset.i] = !state.ui.checks[key][ck.dataset.i];
        renderPage();
        return;
      }
      const rv = e.target.closest("[data-reveal]");
      if (rv) {
        const key = rv.getAttribute("data-reveal");
        const i = Number(rv.dataset.i);
        state.ui.reveal[key] = state.ui.reveal[key] === i ? -1 : i;
        renderPage();
        return;
      }
      const sm = e.target.closest("[data-sim]");
      if (sm && !e.target.closest("[data-sim-start]")) {
        const key = sm.getAttribute("data-sim");
        state.ui.sim[key] = state.ui.sim[key] || { on: {}, tried: false, ok: false };
        state.ui.sim[key].on[sm.dataset.i] = !state.ui.sim[key].on[sm.dataset.i];
        state.ui.sim[key].tried = false;
        renderPage();
        return;
      }
      const start = e.target.closest("[data-sim-start]");
      if (start) {
        const key = start.getAttribute("data-sim-start");
        const [pid, bi] = key.split(":");
        const block = pageById(pid).blocks[Number(bi)];
        const sim = state.ui.sim[key] || { on: {} };
        const ok = (block.items || []).every((_, i) => sim.on[i]);
        state.ui.sim[key] = { on: sim.on, tried: true, ok };
        renderPage();
        return;
      }

      const opt = e.target.closest(".opt");
      if (opt && !opt.closest(".q").classList.contains("locked")) {
        opt.parentElement.querySelectorAll(".opt").forEach(x => x.classList.remove("picked"));
        opt.classList.add("picked");
        return;
      }
      const sub = e.target.closest("[data-submit]");
      if (sub) { grade(sub.getAttribute("data-submit")); return; }
      const retry = e.target.closest("[data-retry]");
      if (retry) {
        delete state.done[retry.getAttribute("data-retry")];
        saveProgress();
        render();
        return;
      }

      if (!state.admin) return;
      if (e.target.closest("[data-add-block]")) {
        const type = document.getElementById("newBlockType").value;
        currentPage().blocks.push(emptyBlock(type));
        saveContent(); render(); return;
      }
      const delB = e.target.closest("[data-del-block]");
      if (delB) {
        currentPage().blocks.splice(Number(delB.getAttribute("data-del-block")), 1);
        saveContent(); render(); return;
      }
      const mv = e.target.closest("[data-move]");
      if (mv) {
        const i = Number(mv.getAttribute("data-move"));
        const j = i + Number(mv.dataset.dir);
        const arr = currentPage().blocks;
        if (j >= 0 && j < arr.length) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          saveContent(); render();
        }
        return;
      }
      const addI = e.target.closest("[data-add-item]");
      if (addI) {
        const block = currentPage().blocks[Number(addI.getAttribute("data-add-item"))];
        const kind = addI.dataset.kind;
        if (kind === "photo") block.items.push({ kind: "pump", caption: "New photo", src: "" });
        else if (kind === "video") block.items.push({ title: "New video", url: "", steps: ["Step 1"] });
        else if (kind === "flow") block.nodes.push({ label: "NODE", sub: "", detail: "Detail" });
        else block.items.push({ label: "Item", detail: "Detail" });
        saveContent(); render(); return;
      }
      const delI = e.target.closest("[data-del-item]");
      if (delI) {
        const [bi, n] = delI.getAttribute("data-del-item").split(":").map(Number);
        const block = currentPage().blocks[bi];
        (block.nodes || block.items).splice(n, 1);
        saveContent(); render(); return;
      }
      const up = e.target.closest("[data-upload]");
      if (up) {
        state.photoTarget = up.getAttribute("data-upload");
        document.getElementById("photoFile").click();
        return;
      }
      if (e.target.closest("[data-add-q]")) {
        currentPage().quiz ||= [];
        currentPage().quiz.push({
          q: "New question?",
          qEs: "¿Nueva pregunta?",
          options: ["A", "B", "C"],
          optionsEs: ["A", "B", "C"],
          a: 0,
          why: "Explanation of the correct answer.",
          whyEs: "Explicación de la respuesta correcta."
        });
        saveContent(); render(); return;
      }
      const delQ = e.target.closest("[data-del-q]");
      if (delQ) {
        currentPage().quiz.splice(Number(delQ.getAttribute("data-del-q")), 1);
        saveContent(); render(); return;
      }
      if (e.target.closest("[data-add-page]")) {
        const id = "sec-" + Date.now();
        content.pages.splice(pages().findIndex(p => p.id === state.page) + 1, 0, {
          id,
          chapter: currentPage().chapter,
          group: currentPage().group,
          anchor: "",
          title: "New slide",
          kicker: currentPage().group,
          lead: "Write the key idea in simple English.",
          audio: "",
          summary: { en: "", es: "" },
          blocks: [{ type: "text", text: "Replace this with operating content." }],
          quiz: []
        });
        state.page = id;
        saveContent(); render(); return;
      }
      if (e.target.closest("[data-del-page]")) {
        if (pages().length < 2) return;
        content.pages = pages().filter(p => p.id !== state.page);
        state.page = pages()[0].id;
        saveContent(); render(); return;
      }
      if (e.target.closest("[data-export]")) {
        const blob = new Blob([JSON.stringify(content, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "operating-manual.json";
        a.click();
        return;
      }
      if (e.target.closest("[data-import]")) {
        document.getElementById("importFile").click();
        return;
      }
      if (e.target.closest("[data-reset]")) {
        if (confirm("Reset all slides to the Reduction Circuit manual?")) {
          content = structuredClone(DEFAULT_CONTENT);
          saveContent();
          state.page = pages()[0].id;
          render();
        }
      }
    });

    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed.pages) throw new Error("no pages");
          content = parsed;
          saveContent();
          state.page = content.pages[0].id;
          render();
        } catch {
          alert("That file is not a valid manual JSON.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.getElementById("photoFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file || !state.photoTarget) return;
      const reader = new FileReader();
      reader.onload = () => {
        const [bi, n] = state.photoTarget.split(":").map(Number);
        currentPage().blocks[bi].items[n].src = reader.result;
        saveContent();
        render();
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    function grade(id) {
      const qs = pageById(id).quiz || [];
      const lang = state.summaryLanguage === "es" ? "es" : "en";
      let right = 0;
      qs.forEach((item, i) => {
        const box = document.querySelector(`[data-qid="${id}-${i}"]`);
        const picked = box.querySelector(".opt.picked");
        const choice = picked ? Number(picked.dataset.choice) : -1;
        const fb = box.querySelector("[data-fb]");
        box.classList.add("locked");
        box.querySelectorAll(".opt").forEach((btn, j) => {
          if (j === item.a) btn.classList.add("right");
          if (choice === j && j !== item.a) btn.classList.add("wrong");
        });
        if (choice === item.a) {
          right += 1;
          fb.className = "feedback show good";
          fb.textContent = lang === "es"
            ? `Correcto. ${item.whyEs || ""}`
            : `Correct. ${item.why || ""}`;
        } else {
          fb.className = "feedback show bad";
          fb.textContent = lang === "es"
            ? `Incorrecto. La opción correcta es ${["A", "B", "C"][item.a]}. ${item.whyEs || ""}`
            : `Incorrect. The correct option is ${["A", "B", "C"][item.a]}. ${item.why || ""}`;
        }
      });
      const pct = Math.round(right / qs.length * 100);
      const pass = pct >= PASS;
      document.querySelector("[data-score]").textContent = lang === "es"
        ? (pass
          ? `Resultado ${pct}%. Capítulo completado.`
          : `Resultado ${pct}%. Revisa el resumen e inténtalo nuevamente.`)
        : (pass
          ? `Score ${pct}%. Chapter complete.`
          : `Score ${pct}%. Review the summary and try again.`);
      state.done[id] = { pass, pct, at: new Date().toISOString(), operator: state.operator || "unknown" };
      if (pass) state.read[id] = true;
      saveProgress();
      renderNav();
    }

    document.addEventListener("keydown", e => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goRel(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goRel(-1); }
    });

    if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { };
    let _tm = JSON.parse(localStorage.getItem("iom-draft-settings") || "{}").themeMode;
    applyTheme("light");
    (async function initViewer() {
      content = await loadContentAsync();
      if (!pages().length) {
        document.getElementById("main").innerHTML = `<section class="card"><h2>No se pudo cargar el manual</h2><p>Verifica Supabase (seed del ejemplo) o la API <code>/api/manuals/…</code>. Fallback: <code>content.js</code> embebido.</p></section>`;
        document.getElementById("progressText").textContent = "0 / 0 sections";
      } else {
        render();
      }
    })();
  </script>
</body>

</html>
